version: '3.8'

services:
  # 1. The Database (Replaces Snowflake/Redshift)
  postgres:
    image: postgres:15
    container_name: de_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: prices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. The Data Lake (Replaces AWS S3)
  minio:
    image: minio/minio
    container_name: de_minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console UI port
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 3. The Scraper Container (Your Python Script)
  scraper:
    build: ./scraper
    container_name: de_scraper
    volumes:
      - ./scraper:/app # Live code reloading
    depends_on:
      - postgres
      - minio
    # NEW (Runs python in unbuffered mode so logs show up instantly)
    command: python -u scheduler.py
  
  # 4. The Dashboard (Streamlit)
  dashboard:
    build: ./dashboard
    container_name: de_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - postgres
    volumes:
      - ./dashboard:/app

volumes:
  postgres_data:
  minio_data:
